name: Unity CI

# Compile-check leger : on lance Unity en mode test-runner EditMode.
# Meme s'il n'y a aucun test EditMode dans le projet, le workflow force
# Unity a charger tous les scripts et asmdef -> si quelque chose ne
# compile pas, le workflow est rouge.
#
# Prerequis : secret UNITY_LICENSE configure dans le repo (voir le
# workflow "Unity — Acquire Activation File" + procedure dans son
# en-tete pour generer le .ulf une fois).

on:
  push:
    branches: [main]

jobs:
  compile-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (avec Git LFS)
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-

      - name: Unity test-runner (compile-check via EditMode)
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          unityVersion: 2022.3.62f3
          testMode: EditMode
          checkName: Unity EditMode compile-check
          artifactsPath: artifacts
          githubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Unity logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unity-logs
          path: artifacts
