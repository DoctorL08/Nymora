name: Unity CI

# Compile-check leger : on lance Unity en mode test-runner EditMode.
# Meme s'il n'y a aucun test EditMode dans le projet, le workflow force
# Unity a charger tous les scripts et asmdef -> si quelque chose ne
# compile pas, le workflow est rouge.
#
# === ETAT : DESACTIVE EN ATTENTE D'UNE LICENSE UNITY ===
# Lorenzo a un compte Unity organisation sans license Pro/Plus achetee,
# et Unity Personal n'apparait pas pour les comptes orga. Solution future :
# soit creer un compte Unity ID secondaire perso (avec une autre adresse
# email), activer Personal dessus, recuperer le .ulf et le coller dans
# le secret UNITY_LICENSE. Soit acheter une Unity Pro license et utiliser
# UNITY_SERIAL + UNITY_EMAIL + UNITY_PASSWORD.
#
# Pour reactiver le workflow apres avoir configure UNITY_LICENSE :
#   - changer 'on: workflow_dispatch' vers 'on: { push: { branches: [main] } }'
#
# Pour declencher MANUELLEMENT en attendant (par ex. apres avoir configure
# la license) : Actions > Unity CI > Run workflow > main > Run.

on:
  workflow_dispatch:

jobs:
  compile-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (avec Git LFS)
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-

      - name: Unity test-runner (compile-check via EditMode)
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          unityVersion: 2022.3.62f3
          testMode: EditMode
          checkName: Unity EditMode compile-check
          artifactsPath: artifacts
          githubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Unity logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unity-logs
          path: artifacts
