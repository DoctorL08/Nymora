name: Unity — Acquire Activation File

# Workflow MANUEL a lancer UNE seule fois pour generer le .alf qui
# permettra ensuite d'obtenir le .ulf (Unity Personal license) a coller
# dans le secret repo UNITY_LICENSE.
#
# Procedure complete :
#   1. Onglet Actions du repo > "Unity — Acquire Activation File" > Run workflow
#   2. Une fois le workflow fini, telecharger l'artifact .alf
#   3. Aller sur https://license.unity3d.com/manual + uploader le .alf
#   4. Telecharger le fichier .ulf retourne par Unity
#   5. Repo Settings > Secrets and variables > Actions > New secret
#      Name : UNITY_LICENSE
#      Value : contenu COMPLET du .ulf (copier-coller tout le XML)
#   6. Ce workflow peut etre desactive / supprime ensuite, il n'est plus utile.

on:
  workflow_dispatch:

jobs:
  activation:
    runs-on: ubuntu-latest
    steps:
      - name: Request manual activation file
        id: getManualLicenseFile
        uses: game-ci/unity-request-activation-file@v2
        with:
          unityVersion: 2022.3.62f3

      - name: Upload activation file
        uses: actions/upload-artifact@v4
        with:
          name: Unity_v2022.3.62f3.alf
          path: ${{ steps.getManualLicenseFile.outputs.filePath }}
